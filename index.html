<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-50 px-4 py-2 rounded-lg bg-[#161C2E]/95 glow-cyan-border text-label-md text-on-surface opacity-0 pointer-events-none transition-opacity duration-300 max-w-[90vw]"></div>
<input id="folderInput" type="file" webkitdirectory multiple class="hidden"/>

<script id="app">
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- constants ---------- */
const VIDEO_EXT = new Set('mp4 m4v mkv webm mov avi wmv flv f4v mpg mpeg mpe m2v ts m2ts mts vob ogv ogm 3gp 3g2 divx rm rmvb asf mxf'.split(' '));
const IGNORE_EXT = new Set('jpg jpeg png gif webp bmp tif tiff svg txt nfo srt vtt ass ssa sub idx json xml html htm exe dll zip rar 7z iso img pdf doc docx xls xlsx db ini url lnk sfv md5 sha1 torrent part tmp log cue mp3 flac wav m4a aac ogg opus wma'.split(' '));
const SUB_EXT = new Set(['srt', 'vtt']);
const JSON_NAME = 'resonance-playlists.json';
const MIN_UNKNOWN = 20 * 1024 * 1024; // files with unknown extensions count as videos if >= 20 MB
const LS = { folder: 'rv.folder', playlists: 'rv.playlists', progress: 'rv.progress', volume: 'rv.volume' };
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];

const jget = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const jdel = k => { try { localStorage.removeItem(k); } catch {} };

/* ---------- IndexedDB (folder handle + thumbnail cache) ---------- */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('resonance-video', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('thumbs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: (s, k) => tx(s, 'readonly', o => o.get(k)).catch(() => undefined),
    set: (s, k, v) => tx(s, 'readwrite', o => o.put(v, k)).catch(() => {}),
    clear: s => tx(s, 'readwrite', o => o.clear()).catch(() => {})
  };
})();

/* ---------- state ---------- */
const state = {
  handle: null, folderName: '', writable: false, needsPermission: false, scanning: false, fallback: false,
  items: [], byId: new Map(), playlists: [], progress: {},
  queue: [], qi: -1, currentId: null, filter: 'all', sort: 'recent', search: '', limit: 60,
  subsOn: true, attempt: 0, started: false
};

/* ---------- helpers ---------- */
const fmtSize = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : b >= 1048576 ? Math.round(b / 1048576) + ' MB' : Math.round(b / 1024) + ' KB';
const fmtTime = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtDur = s => { if (!isFinite(s) || !s) return ''; const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; };
const resLabel = h => h >= 2000 ? '4K' : h >= 1000 ? '1080p' : h >= 700 ? '720p' : h ? h + 'p' : '';
const qualityTag = n => /2160p|\b4k\b|uhd/i.test(n) ? '4K' : /1080p/i.test(n) ? '1080p' : /720p/i.test(n) ? '720p' : /480p/i.test(n) ? '480p' : '';
const uid = () => Math.random().toString(36).slice(2, 10);
function parseName(name) {
  const base = name.replace(/\.[^.]+$/, '');
  const ym = base.match(/(?:^|[\s._(\[-])((?:19|20)\d{2})(?=$|[\s._)\]-])/);
  const year = ym ? ym[1] : '';
  let t = base.replace(/[._]+/g, ' ');
  if (ym) { const i = t.indexOf(year); if (i > 2) t = t.slice(0, i); }
  t = t.replace(/[\[(].*?[\])]/g, ' ').replace(/\b(2160p|1080p|720p|480p|4k|uhd|bluray|brrip|bdrip|webrip|web-dl|webdl|hdtv|hdr10?|dv|x26[45]|h26[45]|hevc|avc|aac|ac3|dts|remux|proper|extended)\b.*$/i, '').replace(/\s+/g, ' ').trim();
  return { title: t || base, year };
}
let toastT;
function toast(msg, ms = 3800) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, ms);
}
const prog = id => state.progress[id];
const saveProgress = () => jset(LS.progress, state.progress);

/* ---------- storage: playlists JSON ---------- */
let jsonTimer;
function savePlaylists() {
  jset(LS.playlists, state.playlists);
  clearTimeout(jsonTimer); jsonTimer = setTimeout(writeJsonFile, 400);
}
async function writeJsonFile() {
  if (!state.handle) return;
  try {
    if ((await state.handle.queryPermission({ mode: 'readwrite' })) !== 'granted') { state.writable = false; return; }
    state.writable = true;
    const fh = await state.handle.getFileHandle(JSON_NAME, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({ version: 1, folder: state.folderName, updated: new Date().toISOString(), playlists: state.playlists }, null, 2));
    await w.close();
  } catch (e) { console.warn('JSON write failed', e); }
}
async function readJsonFile() {
  if (!state.handle) return null;
  try {
    const fh = await state.handle.getFileHandle(JSON_NAME);
    const data = JSON.parse(await (await fh.getFile()).text());
    return Array.isArray(data.playlists) ? data.playlists : null;
  } catch { return null; }
}
async function resetStorage() {
  state.playlists = []; state.progress = {};
  jdel(LS.playlists); jdel(LS.progress);
  await idb.clear('thumbs');
}

/* ---------- scanning ---------- */
async function walk(dir, prefix, out, top) {
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith('.')) continue;
    if (h.kind === 'directory') await walk(h, prefix + name + '/', out, top || name);
    else out.push({ name, path: prefix + name, dir: prefix, top: top || '', getFile: () => h.getFile() });
  }
}
async function buildItems(entries) {
  const subs = new Map(), cands = [];
  for (const e of entries) {
    if (e.name === JSON_NAME) continue;
    const dot = e.name.lastIndexOf('.'); const ext = dot > 0 ? e.name.slice(dot + 1).toLowerCase() : '';
    e.ext = ext;
    if (SUB_EXT.has(ext)) { subs.set((e.dir + e.name.slice(0, dot)).toLowerCase(), e); continue; }
    if (IGNORE_EXT.has(ext)) continue;
    cands.push(e);
  }
  const items = [];
  for (let i = 0; i < cands.length; i += 24) {
    await Promise.all(cands.slice(i, i + 24).map(async e => {
      try {
        const file = await e.getFile(); const known = VIDEO_EXT.has(e.ext);
        if (!known && file.size < MIN_UNKNOWN) return;
        const { title, year } = parseName(e.name); const dot = e.name.lastIndexOf('.');
        const sub = subs.get((e.dir + (dot > 0 ? e.name.slice(0, dot) : e.name)).toLowerCase()) || null;
        items.push({ id: e.path, name: e.name, ext: e.ext || '?', size: file.size, mtime: file.lastModified, file, top: e.top, known, title, year, sub });
      } catch {}
    }));
  }
  state.items = items; state.byId = new Map(items.map(i => [i.id, i]));
}
async function scan() {
  state.scanning = true; renderAll();
  const entries = [];
  try { await walk(state.handle, '', entries, ''); await buildItems(entries); }
  catch (e) { console.error(e); toast('Could not read the folder: ' + e.message); }
  const fromFile = await readJsonFile();
  if (fromFile) { state.playlists = fromFile; jset(LS.playlists, fromFile); }
  state.scanning = false; state.limit = 60;
  renderAll();
  if (state.handle) writeJsonFile();
}

/* ---------- folder picking ---------- */
async function pickFolder() {
  if (!window.showDirectoryPicker) { $('#folderInput').click(); return; }
  try {
    const h = await showDirectoryPicker({ mode: 'readwrite', id: 'resonance-video' });
    await adoptFolder(h);
  } catch (e) { if (e.name !== 'AbortError') toast('Could not open folder: ' + e.message); }
}
async function adoptFolder(h) {
  const prev = await idb.get('kv', 'dir'); let same = false;
  if (prev) { try { same = await prev.isSameEntry(h); } catch {} }
  if (!same) await resetStorage();
  state.fallback = false; state.needsPermission = false;
  state.handle = h; state.folderName = h.name;
  await idb.set('kv', 'dir', h); jset(LS.folder, { name: h.name, at: Date.now() });
  try { state.writable = (await h.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch { state.writable = false; }
  stopPlayback();
  await scan();
  if (!same) { await writeJsonFile(); toast(`Folder set to “${h.name}”. Playlists were reset.`); }
}
async function reconnect() {

    <button data-act="exportJson" class="py-2.5 rounded-lg bg-surface-container-high hover:bg-surface-variant text-on-surface border border-outline-variant/40 text-label-md flex items-center justify-center gap-2 transition"><span class="material-symbols-outlined text-base">download</span>Export JSON</button>
  </div>`;
}

/* ---------- modals ---------- */
function openModal(html) {
  const m = $('#modal'); m.innerHTML = `<div class="w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-xl bg-[#161C2E]/95 glow-cyan-border p-6 space-y-4" data-stop>${html}</div>`;
  m.classList.remove('hidden'); m.classList.add('flex');
}
function closeModal() { const m = $('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function promptName(title, initial, okLabel, cb) {
  openModal(`<h3 class="text-headline-sm">${esc(title)}</h3><input id="nameIn" value="${esc(initial || '')}" maxlength="60" placeholder="Playlist name" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-lg px-3 py-2 text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container/40"/>
  <div class="flex justify-end gap-2"><button data-act="closeModal" class="px-4 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-label-md">Cancel</button><button id="nameOk" class="px-4 py-2 rounded-lg bg-primary-container text-on-primary text-label-md glow-cyan-sm">${esc(okLabel)}</button></div>`);
  const inp = $('#nameIn'); inp.focus(); inp.select();
  const go = () => { const v = inp.value.trim(); if (!v) return; closeModal(); cb(v); };
  $('#nameOk').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}
function newPlaylist(thenAdd) {
  promptName('New playlist', '', 'Create', name => {
    const p = { id: uid(), name, items: thenAdd ? [thenAdd] : [], created: Date.now() };
    state.playlists.push(p); savePlaylists(); renderAll();
    toast(thenAdd ? `Added to “${name}”` : `Created “${name}”`);
  });
}
function addToPlaylistModal(id) {
  const it = state.byId.get(id); if (!it) return;
  openModal(`<h3 class="text-headline-sm">Add to playlist</h3><p class="text-body-sm text-on-surface-variant truncate">${esc(it.title)}</p>
  <div class="space-y-1">${state.playlists.map(p => { const has = p.items.includes(id); return `<button data-act="togglePl" data-pl="${p.id}" data-id="${esc(id)}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-surface-variant/40 transition text-left"><span class="material-symbols-outlined ${has ? 'text-primary fill' : 'text-outline'}">${has ? 'check_box' : 'check_box_outline_blank'}</span><span class="flex-1 truncate text-label-lg">${esc(p.name)}</span><span class="text-label-sm font-mono-metric text-outline">${p.items.length}</span></button>`; }).join('') || '<p class="text-body-sm text-outline py-2">No playlists yet.</p>'}</div>
  <div class="flex justify-between gap-2 pt-2"><button data-act="newPlaylistAdd" data-id="${esc(id)}" class="px-4 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-label-md flex items-center gap-2"><span class="material-symbols-outlined text-base">add</span>New playlist</button><button data-act="closeModal" class="px-4 py-2 rounded-lg bg-primary-container text-on-primary text-label-md">Done</button></div>`);
}
function playlistModal(plId) {
  const p = state.playlists.find(x => x.id === plId); if (!p) return;
  const its = p.items.map(id => ({ id, it: state.byId.get(id) }));
  openModal(`<div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="text-headline-md truncate">${esc(p.name)}</h3><p class="text-body-sm text-on-surface-variant">${p.items.length} video${p.items.length === 1 ? '' : 's'}</p></div>
    <button data-act="closeModal" class="p-1.5 rounded-lg hover:bg-surface-variant/40"><span class="material-symbols-outlined">close</span></button></div>
  <div class="flex gap-2 flex-wrap"><button data-act="plPlay" data-pl="${p.id}" class="px-4 py-2 rounded-lg bg-primary-container text-on-primary text-label-md flex items-center gap-2 glow-cyan-sm"><span class="material-symbols-outlined text-base fill">play_arrow</span>Play all</button>
    <button data-act="plShuffle" data-pl="${p.id}" class="px-4 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-label-md flex items-center gap-2"><span class="material-symbols-outlined text-base">shuffle</span>Shuffle</button>
    <button data-act="plRename" data-pl="${p.id}" class="px-4 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-label-md flex items-center gap-2"><span class="material-symbols-outlined text-base">edit</span>Rename</button>
    <button data-act="plDelete" data-pl="${p.id}" class="px-4 py-2 rounded-lg bg-error-container/40 border border-error/30 text-error text-label-md flex items-center gap-2"><span class="material-symbols-outlined text-base">delete</span>Delete</button></div>
  <div class="space-y-1">${its.map(({ id, it }) => it ? `<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-surface-variant/30 group">
      <button data-act="plPlayOne" data-pl="${p.id}" data-id="${esc(id)}" class="relative w-24 aspect-video rounded overflow-hidden bg-surface-container flex-shrink-0"><span class="pz absolute inset-0" data-id="${esc(id)}" data-nodur="1">${it.meta && it.meta.img ? `<img src="${it.meta.img}" class="w-full h-full object-cover"/>` : ''}</span><span class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition"><span class="material-symbols-outlined text-primary fill">play_arrow</span></span></button>
      <div class="min-w-0 flex-1"><div class="text-label-lg truncate">${esc(it.title)}</div><div class="text-body-sm text-outline truncate">${esc(fmtSize(it.size))} • ${esc(it.ext.toUpperCase())}</div></div>
      <button data-act="plRemove" data-pl="${p.id}" data-id="${esc(id)}" class="p-1.5 rounded-lg text-outline hover:text-error hover:bg-surface-variant/40" title="Remove"><span class="material-symbols-outlined text-lg">remove_circle_outline</span></button></div>`
    : `<div class="flex items-center gap-3 p-2 rounded-lg opacity-60"><span class="material-symbols-outlined text-outline">report</span><div class="flex-1 min-w-0"><div class="text-label-lg truncate">${esc(id.split('/').pop())}</div><div class="text-body-sm text-outline">Missing from this folder</div></div><button data-act="plRemove" data-pl="${p.id}" data-id="${esc(id)}" class="p-1.5 rounded-lg text-outline hover:text-error"><span class="material-symbols-outlined text-lg">remove_circle_outline</span></button></div>`).join('') || '<p class="text-body-sm text-outline py-4 text-center">This playlist is empty. Hover a video in the library and press “add to playlist”.</p>'}</div>`);
  observePz();
}
function infoModal(id) {
  const it = state.byId.get(id); if (!it) return; const m = it.meta;
  const row = (k, v) => `<div class="flex justify-between gap-4 py-1.5 border-b border-outline-variant/10"><span class="text-outline">${k}</span><span class="text-on-surface text-right break-all">${esc(v)}</span></div>`;
  openModal(`<div class="flex items-start justify-between gap-3"><h3 class="text-headline-sm">${esc(it.title)}</h3><button data-act="closeModal" class="p-1.5 rounded-lg hover:bg-surface-variant/40"><span class="material-symbols-outlined">close</span></button></div>
  <div class="font-mono-metric text-label-sm">${row('File', it.name)}${row('Path', it.id)}${row('Size', fmtSize(it.size))}${row('Container', it.ext.toUpperCase() + (it.known ? '' : ' (unrecognised extension)'))}${m && m.w ? row('Resolution', m.w + '×' + m.h) : ''}${m && m.dur ? row('Duration', fmtTime(m.dur)) : ''}${row('Modified', new Date(it.mtime).toLocaleString())}${row('Subtitles', it.sub ? it.sub.name : 'none found')}</div>`);
}

/* ---------- player ---------- */
const video = $('#video'), hero = $('#hero');
let objUrl = null, subUrl = null, lastSave = 0;
video.volume = jget(LS.volume, 0.8); setVolUI();

function stopPlayback() {
  video.pause(); video.removeAttribute('src'); video.load();
  if (objUrl) URL.revokeObjectURL(objUrl); objUrl = null;
  state.currentId = null; state.queue = []; state.qi = -1; state.started = false;
  hero.classList.remove('started', 'is-playing');
}
async function playItem(id, opts = {}) {
  const it = state.byId.get(id); if (!it) return;
  if (opts.queue) state.queue = opts.queue.slice();
  if (!state.queue.includes(id)) state.queue = [id];
  state.qi = state.queue.indexOf(id);
  state.currentId = id; state.attempt = 0; state.started = true; it.broken = false;
  hero.classList.add('started');
  await loadSource(it);
  renderHero(); renderContinue(); renderLibrary(); updateNow(); observePz();
  if (opts.scroll !== false) window.scrollTo({ top: 0, behavior: 'smooth' });
}
const MIMES = [null, 'video/mp4', 'video/webm', 'video/x-matroska', 'video/quicktime'];
async function loadSource(it) {
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  const type = MIMES[state.attempt];
  const blob = type === null ? it.file : it.file.slice(0, it.file.size, type);
  objUrl = URL.createObjectURL(blob);
  video.src = objUrl;
  video.onerror = () => {
    if (state.currentId !== it.id) return;
    state.attempt++;
    if (state.attempt < MIMES.length) { loadSource(it); return; }
    it.broken = true; renderLibrary(); observePz();
    toast(`Can’t play “${it.title}” — this browser doesn’t support its codec (common with HEVC/AC3/DTS). Try Edge/Chrome with hardware HEVC, or convert the file.`, 7000);
    hero.classList.remove('is-playing');
  };
  setupSubtitles(it);
  try { await video.play(); } catch (e) { if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') console.warn(e); }
}
async function setupSubtitles(it) {
  $$('track', video).forEach(t => t.remove());
  if (subUrl) { URL.revokeObjectURL(subUrl); subUrl = null; }
  const btn = $('#btnCC');
  if (!it.sub) { btn.classList.add('hidden'); return; }
  try {
    const f = await it.sub.getFile(); let txt = await f.text();
    if (/\.srt$/i.test(it.sub.name)) txt = 'WEBVTT\n\n' + txt.replace(/\r+/g, '').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    subUrl = URL.createObjectURL(new Blob([txt], { type: 'text/vtt' }));
    const tr = document.createElement('track'); tr.kind = 'subtitles'; tr.label = 'Subtitles'; tr.src = subUrl; tr.default = true;
    video.appendChild(tr); tr.onload = () => { tr.track.mode = state.subsOn ? 'showing' : 'hidden'; };
    setTimeout(() => { if (tr.track) tr.track.mode = state.subsOn ? 'showing' : 'hidden'; }, 300);
    btn.classList.remove('hidden'); btn.classList.toggle('text-primary', state.subsOn);
  } catch { btn.classList.add('hidden'); }
}
function next(dir = 1) {
  const n = state.qi + dir;
  if (n >= 0 && n < state.queue.length) playItem(state.queue[n], { scroll: false });
  else if (dir > 0) { toast('End of queue'); }
}
function updateNow() {
  const it = state.currentId && state.byId.get(state.currentId);
  $('#dockTitle').textContent = it ? it.title : 'Nothing playing';
  $('#dockSub').textContent = it ? (it.top ? it.top + ' • ' : '') + it.name : 'Pick a title from your library';
  const m = it && it.meta;
  $('#dockTech').textContent = it ? [it.ext.toUpperCase(), m && m.h ? resLabel(m.h) : '', fmtSize(it.size), state.queue.length > 1 ? `${state.qi + 1}/${state.queue.length}` : ''].filter(Boolean).join(' • ') : '';
  $('#dockThumb').innerHTML = m && m.img ? `<img src="${m.img}" class="w-full h-full object-cover"/>` : `<span class="material-symbols-outlined text-outline/60">movie</span>`;
}
function togglePlay() {
  if (!state.currentId) { const it = heroItem(); if (it) playItem(it.id, { queue: filtered().map(i => i.id), scroll: false }); return; }
  video.paused ? video.play().catch(() => {}) : video.pause();
}
function persistNow(force) {
  const id = state.currentId; if (!id || !isFinite(video.duration) || !video.duration) return;
  const t = video.currentTime, d = video.duration, now = Date.now();
  if (!force && now - lastSave < 4000) return; lastSave = now;
  const done = t / d > 0.95;
  state.progress[id] = { t: done ? 0 : t, d, u: now, done: done || (state.progress[id] && state.progress[id].done && t < 5) };
  saveProgress();
}
video.addEventListener('loadedmetadata', () => {
  const it = state.byId.get(state.currentId); if (!it) return;
  const p = prog(it.id);
  if (p && p.t > 5 && p.t < video.duration - 10 && !p.done) video.currentTime = p.t;
  it.meta = Object.assign({}, it.meta, { dur: video.duration, w: video.videoWidth, h: video.videoHeight });
  $('#tDur').textContent = fmtTime(video.duration);
  applyMeta(it); updateNow();
});
video.addEventListener('timeupdate', () => {
  const d = video.duration || 0;
  $('#tCur').textContent = fmtTime(video.currentTime); $('#tDur').textContent = fmtTime(d);
  if (!scrubbing) $('#scrubFill').style.width = d ? (video.currentTime / d * 100) + '%' : '0%';
  persistNow(false);
});
video.addEventListener('play', () => { hero.classList.add('is-playing'); $('#playIcon').textContent = 'pause'; renderHero(); });
video.addEventListener('pause', () => { hero.classList.remove('is-playing'); $('#playIcon').textContent = 'play_arrow'; persistNow(true); renderContinue(); observePz(); });
video.addEventListener('ended', () => {
  const id = state.currentId; if (id) { state.progress[id] = { t: 0, d: video.duration, u: Date.now(), done: true }; saveProgress(); }
  renderContinue(); renderLibrary(); observePz();
  if (state.qi + 1 < state.queue.length) next(1);
});
window.addEventListener('beforeunload', () => persistNow(true));
video.addEventListener('click', togglePlay);
$('#heroPlay').addEventListener('click', togglePlay);
$('#btnPlay').addEventListener('click', togglePlay);
$('#btnBack').addEventListener('click', () => video.currentTime = Math.max(0, video.currentTime - 10));
$('#btnFwd').addEventListener('click', () => video.currentTime = Math.min(video.duration || 0, video.currentTime + 10));
$('#btnPrev').addEventListener('click', () => (video.currentTime > 5 || state.qi <= 0) ? (video.currentTime = 0) : next(-1));
$('#btnNext').addEventListener('click', () => next(1));
$('#btnFs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen && video.requestFullscreen());
document.addEventListener('fullscreenchange', () => { video.controls = document.fullscreenElement === video; });
$('#btnPip').addEventListener('click', () => { if (document.pictureInPictureElement) document.exitPictureInPicture(); else if (video.readyState && video.requestPictureInPicture) video.requestPictureInPicture().catch(() => {}); });
$('#btnCC').addEventListener('click', () => { state.subsOn = !state.subsOn; const t = video.textTracks[0]; if (t) t.mode = state.subsOn ? 'showing' : 'hidden'; $('#btnCC').classList.toggle('text-primary', state.subsOn); });
$('#btnSpeed').addEventListener('click', () => { const i = (SPEEDS.indexOf(video.playbackRate) + 1) % SPEEDS.length; video.playbackRate = SPEEDS[i]; $('#btnSpeed').textContent = SPEEDS[i] + '×'; });
$('#btnTheater').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
$('#btnMute').addEventListener('click', () => { video.muted = !video.muted; setVolUI(); });
function setVolUI() {
  const v = video.muted ? 0 : video.volume;
  $('#volFill').style.width = (v * 100) + '%';
  $('#volIcon').textContent = v === 0 ? 'volume_off' : v < 0.5 ? 'volume_down' : 'volume_up';
}
function slider(el, cb) {
  let drag = false;
  const pos = e => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); cb(pos(e), 'down'); });
  el.addEventListener('pointermove', e => { if (drag) cb(pos(e), 'move'); });
  el.addEventListener('pointerup', e => { if (drag) { drag = false; cb(pos(e), 'up'); } });
}
let scrubbing = false;
slider($('#scrub'), (f, phase) => {
  if (!video.duration) return;
  scrubbing = phase !== 'up'; $('#scrubFill').style.width = (f * 100) + '%';
  if (phase === 'up' || phase === 'down') video.currentTime = f * video.duration;
});
$('#scrub').addEventListener('pointermove', e => {
  const r = e.currentTarget.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), tip = $('#scrubTip');
  tip.classList.remove('hidden'); tip.style.left = (f * 100) + '%'; tip.textContent = fmtTime(f * (video.duration || 0));
});
$('#scrub').addEventListener('pointerleave', () => $('#scrubTip').classList.add('hidden'));
slider($('#vol'), f => { video.muted = false; video.volume = f; jset(LS.volume, f); setVolUI(); });

/* ---------- actions ---------- */
function scrollToEl(sel) { const el = $(sel); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 80, behavior: 'smooth' }); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-nav],[data-card]'); if (!t) return;
  if (t.dataset.nav) { e.preventDefault(); const n = t.dataset.nav;
    if (n === 'recent') { state.sort = 'recent'; state.filter = 'all'; $('#sort').value = 'recent'; renderPills(); renderLibrary(); observePz(); }
    scrollToEl(n === 'continue' ? '#continueSection' : n === 'playlists' ? '#playlistsSection' : '#librarySection'); return; }
  const a = t.dataset.act, id = t.dataset.id, plId = t.dataset.pl;
  if (!a) { // card body click
    const cid = t.dataset.card; const ctx = t.closest('#continueSection') ? continueList() : filtered();
    playItem(cid, { queue: ctx.map(i => i.id) }); return; }
  e.preventDefault(); e.stopPropagation();
  switch (a) {
    case 'pickFolder': pickFolder(); break;
    case 'reconnect': reconnect(); break;
    case 'rescan': if (state.handle) scan().then(() => toast('Library refreshed')); else $('#folderInput').click(); break;
    case 'play': { const ctx = t.closest('#continueSection') ? continueList() : filtered(); playItem(id, { queue: ctx.map(i => i.id) }); break; }
    case 'addpl': addToPlaylistModal(id); break;
    case 'info': infoModal(id); break;
    case 'filter': state.filter = t.dataset.k; state.limit = 60; renderPills(); renderLibrary(); observePz(); break;
    case 'more': state.limit += 60; renderLibrary(); observePz(); break;
    case 'newPlaylist': newPlaylist(); break;
    case 'newPlaylistAdd': closeModal(); newPlaylist(id); break;
    case 'openPl': playlistModal(t.dataset.id); break;
    case 'closeModal': closeModal(); break;
    case 'togglePl': { const p = state.playlists.find(x => x.id === plId); if (!p) break; const i = p.items.indexOf(id); i >= 0 ? p.items.splice(i, 1) : p.items.push(id); savePlaylists(); renderAll(); addToPlaylistModal(id); break; }
    case 'plPlay': case 'plShuffle': { const p = state.playlists.find(x => x.id === plId); const its = p ? plItems(p) : []; if (!its.length) { toast('Nothing playable in this playlist'); break; }
      let q = its.map(i => i.id); if (a === 'plShuffle') q.sort(() => Math.random() - 0.5);
      closeModal(); playItem(q[0], { queue: q }); break; }
    case 'plPlayOne': { const p = state.playlists.find(x => x.id === plId); const q = plItems(p).map(i => i.id); closeModal(); playItem(id, { queue: q }); break; }
    case 'plRemove': { const p = state.playlists.find(x => x.id === plId); p.items = p.items.filter(x => x !== id); savePlaylists(); renderAll(); playlistModal(plId); break; }
    case 'plRename': { const p = state.playlists.find(x => x.id === plId); promptName('Rename playlist', p.name, 'Save', n => { p.name = n; savePlaylists(); renderAll(); playlistModal(plId); }); break; }
    case 'plDelete': { const p = state.playlists.find(x => x.id === plId);
      openModal(`<h3 class="text-headline-sm">Delete “${esc(p.name)}”?</h3><p class="text-body-sm text-on-surface-variant">Your video files are not touched — only the playlist is removed.</p><div class="flex justify-end gap-2"><button data-act="closeModal" class="px-4 py-2 rounded-lg bg-surface-container-high border border-outline-variant/40 text-label-md">Cancel</button><button id="delOk" class="px-4 py-2 rounded-lg bg-error-container text-error text-label-md">Delete</button></div>`);
      $('#delOk').onclick = () => { state.playlists = state.playlists.filter(x => x.id !== plId); savePlaylists(); closeModal(); renderAll(); }; break; }
    case 'exportJson': { const blob = new Blob([JSON.stringify({ version: 1, folder: state.folderName, exported: new Date().toISOString(), playlists: state.playlists }, null, 2)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = JSON_NAME; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); break; }
  }
});
$('#search').addEventListener('input', e => { state.search = e.target.value; state.limit = 60; renderLibrary(); observePz(); });
$('#search').addEventListener('keydown', e => { if (e.key === 'Enter') scrollToEl('#librarySection'); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderLibrary(); observePz(); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); return; }
  if (e.key === 'Escape') { closeModal(); return; }
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 10);
  else if (e.key === 'ArrowRight') video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
  else if (e.key === 'ArrowUp') { e.preventDefault(); video.volume = Math.min(1, video.volume + .05); jset(LS.volume, video.volume); setVolUI(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); video.volume = Math.max(0, video.volume - .05); jset(LS.volume, video.volume); setVolUI(); }
  else if (e.key.toLowerCase() === 'f') $('#btnFs').click();
  else if (e.key.toLowerCase() === 'm') { video.muted = !video.muted; setVolUI(); }
  else if (e.key.toLowerCase() === 'n') next(1);
});

/* ---------- boot ---------- */
(async function boot() {
  state.playlists = jget(LS.playlists, []); state.progress = jget(LS.progress, {});
  const meta = jget(LS.folder, null);
  if (meta) state.folderName = meta.name;
  renderAll();
  if (window.showDirectoryPicker && meta && !meta.fallback) {
    const h = await idb.get('kv', 'dir');
    if (h) {
      state.handle = h; state.folderName = h.name; let p = 'prompt';
      try { p = await h.queryPermission({ mode: 'readwrite' }); } catch {}
      if (p === 'granted') { state.writable = true; await scan(); }
      else { state.needsPermission = true; renderAll(); }
    }
  }
})();
})();
</script>
</body></html>
